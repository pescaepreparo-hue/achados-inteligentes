# Achados Inteligentes V9 — site estático
# Netlify: importe o repositório GitHub, branch main. Sem build, publicação na raiz.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
